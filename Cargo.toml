[package]
name = "agent-skill-map"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "asm"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
ctrlc = "3.5.2"
fancy-regex = "0.20.2"
hex = "0.4.3"
icu_collator = "2.4.0"
ignore = "0.4.34"
notify = "8.2.2"
pulldown-cmark = "0.13.6"
rayon = "1.12.0"
rusqlite = { version = "0.42.0", features = ["bundled", "fallible_uint"] }
ryu-js = "1.0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
tiktoken-rs = "0.12.1"
time = "0.3.55"
toml = { version = "1.2.1", features = ["preserve_order"] }
unicode-general-category = "1.1.0"
unicode-normalization = "0.1.26"
url = "2.5.8"
yaml-rust2 = "0.10.4"

[dev-dependencies]
tempfile = "3.27.0"
